<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>九原吉祥门窗服务 · 微信服务卡</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#eef2f5}
  body{width:750px;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  .card{width:750px;background:linear-gradient(168deg,#0c4370 0%,#083453 42%,#062a45 100%);color:#fff;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;width:560px;height:560px;right:-220px;top:-260px;border-radius:50%;background:radial-gradient(circle,rgba(42,139,208,.35),transparent 70%)}
  .inner{position:relative;padding:52px 42px 0}

  /* 品牌 */
  .brand{display:flex;align-items:center;gap:16px}
  .mark{width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .mark svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:1.7}
  .brand strong{display:block;font-size:31px;font-weight:800;letter-spacing:.5px}
  .brand span{display:block;font-size:19px;color:rgba(255,255,255,.66);margin-top:4px;letter-spacing:.4px}

  /* 主标题 */
  h1{font-size:62px;line-height:1.24;font-weight:800;letter-spacing:1px;margin-top:34px}
  h1 em{font-style:normal;color:#ffbe8c}
  .services{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
  .services span{font-size:21px;font-weight:600;padding:9px 18px;border-radius:100px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.94)}

  /* 三大承诺 */
  .promise{display:flex;margin-top:34px;padding:22px 0;border-top:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,255,255,.16)}
  .promise div{flex:1;text-align:center;position:relative}
  .promise div+div::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:rgba(255,255,255,.16)}
  .promise b{display:block;font-size:25px;font-weight:800;color:#fff;letter-spacing:.5px}
  .promise i{display:block;font-style:normal;font-size:17px;color:rgba(255,255,255,.58);margin-top:6px;letter-spacing:.3px}

  /* 实拍 */
  .shots{display:flex;gap:10px;margin-top:30px}
  .shots figure{flex:1;margin:0;position:relative;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.18)}
  .shots img{width:100%;height:236px;object-fit:cover;display:block}
  .shots figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 9px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(180deg,transparent,rgba(4,20,34,.9))}

  /* 电话与微信 */
  .contact{margin-top:32px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:24px 26px}
  .contact__hint{font-size:19px;color:rgba(255,255,255,.62);letter-spacing:.5px;margin-bottom:10px}
  .person{display:flex;align-items:baseline;gap:14px;padding:5px 0}
  .person em{font-style:normal;font-size:22px;color:rgba(255,255,255,.8);flex:0 0 auto}
  .person b{font-size:47px;font-weight:800;letter-spacing:1px;line-height:1.15;color:#ffb27a}
  .wx{margin-top:18px;display:flex;align-items:center;gap:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:20px 26px}
  .wx__text{flex:1}
  .wx__text b{display:block;font-size:22px;font-weight:800;color:#fff;margin-bottom:7px}
  .wx__text span{display:block;font-size:17px;color:rgba(255,255,255,.62);line-height:1.6}
  .wx__qr{flex:0 0 auto;display:flex;gap:14px}
  .wx__qr figure{margin:0;text-align:center;width:132px}
  .wx__qr img{width:132px;height:132px;background:#fff;padding:6px;border-radius:12px;display:block}
  .wx__qr figcaption{font-size:15px;color:rgba(255,255,255,.72);margin-top:7px}

  /* 底 */
  .foot{margin-top:28px;padding:20px 0 34px;border-top:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:space-between;font-size:18px;color:rgba(255,255,255,.62);letter-spacing:.4px}
  .foot b{color:#fff;font-weight:700}
</style>
</head>
