<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>九原吉祥门窗服务 · 朋友圈方图</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1080px;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  .sq{width:1080px;height:1080px;padding:76px 72px 64px;background:linear-gradient(160deg,#0d4574 0%,#083453 48%,#062a45 100%);color:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .sq::before{content:"";position:absolute;width:700px;height:700px;right:-260px;top:-320px;border-radius:50%;background:radial-gradient(circle,rgba(42,139,208,.34),transparent 70%)}
  .sq::after{content:"";position:absolute;width:520px;height:520px;left:-240px;bottom:-260px;border-radius:50%;background:radial-gradient(circle,rgba(242,101,27,.16),transparent 70%)}
  .top{position:relative;display:flex;align-items:center;gap:22px}
  .mark{width:84px;height:84px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center}
  .mark svg{width:44px;height:44px;stroke:#fff;fill:none;stroke-width:1.7}
  .name{font-size:44px;font-weight:800;letter-spacing:1px;line-height:1.2}
  .sub{font-size:27px;color:rgba(255,255,255,.66);margin-top:8px;letter-spacing:.6px}

  .mid{position:relative;margin-top:56px}
  h1{font-size:82px;line-height:1.32;font-weight:800;letter-spacing:1px}
  h1 em{font-style:normal;color:#ffbe8c}

  .tags{position:relative;display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
  .tags span{font-size:29px;font-weight:600;padding:12px 26px;border-radius:100px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.24);color:rgba(255,255,255,.95)}

  .bar{position:relative;display:flex;margin-top:38px;padding:24px 0;border-top:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,255,255,.16)}
  .bar div{flex:1;text-align:center;position:relative;font-size:33px;font-weight:800;letter-spacing:1px}
  .bar div+div::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:rgba(255,255,255,.18)}

  .bottom{position:relative;margin-top:auto;padding-top:40px;display:flex;align-items:flex-end;gap:36px}
  .tels{flex:1}
  .tels .hint{font-size:26px;color:rgba(255,255,255,.6);letter-spacing:1px;margin-bottom:16px}
  .row{display:flex;align-items:baseline;gap:18px;padding:5px 0}
  .row em{font-style:normal;font-size:30px;color:rgba(255,255,255,.82);flex:0 0 auto}
  .row b{font-size:66px;font-weight:800;letter-spacing:1px;color:#ffb27a;line-height:1.12}
  .qrs{flex:0 0 auto;display:flex;gap:14px}
  .qrs figure{margin:0;width:142px;text-align:center}
  .qrs img{width:142px;height:142px;background:#fff;padding:8px;border-radius:14px;display:block}
  .qrs figcaption{font-size:19px;color:rgba(255,255,255,.64);margin-top:8px}
  .addr{position:relative;margin-top:24px;font-size:24px;color:rgba(255,255,255,.52);letter-spacing:.6px}
</style>
</head>
<body>
<div class="sq">
  <div class="top">
    <div class="mark"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M12 3.5v17M3.5 12h17"/></svg></div>
    <div>
      <div class="name">九原吉祥门窗服务</div>
      <div class="sub">包头市九原区 · 本地专业老师傅直营</div>
    </div>
  </div>

  <div class="mid">
    <h1>断桥铝门窗 · 金刚纱窗<br><em>漏风维修 · 换漏气玻璃</em></h1>
    <div class="tags">
      <span>免费上门量尺</span><span>先报价后施工</span><span>完工验收</span>
    </div>
    <div class="bar">
      <div>没有中间商</div><div>质量保证</div><div>本地老师傅</div>
    </div>
  </div>

  <div class="bottom">
    <div class="tels">
      <div class="hint">打电话，或长按识别二维码加微信</div>
      <div class="row"><em>吉继山</em><b>15147291185</b></div>
      <div class="row"><em>刘红侠</em><b>18247359113</b></div>
    </div>
    <div class="qrs">
      <figure><img src="../assets/img/qr/wx-jijishan.png" alt="吉继山微信二维码"><figcaption>吉继山</figcaption></figure>
      <figure><img src="../assets/img/qr/wx-liuhongxia.png" alt="刘红侠微信二维码"><figcaption>刘红侠</figcaption></figure>
    </div>
  </div>

  <div class="addr">包头市九原区 · 没有中间商 · 质量保证 · 就近上门</div>
</div>
</body>
</html>
